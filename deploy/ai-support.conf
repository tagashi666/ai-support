# /etc/nginx/sites-available/ai-support.conf
#
# Реверс-прокси для панели. Панель слушает только 127.0.0.1:8080 — наружу её
# отдаёт nginx с TLS и проброшенным WebSocket. Замените support.example.com
# на свой домен и поправьте пути к сертификату (их выдаст certbot, см. DEPLOY.md).

# HTTP: пускаем только ACME-проверку certbot, остальное — на HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name support.example.com;

    # Продление сертификата Let's Encrypt (webroot-проверка).
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name support.example.com;
    server_tokens off;

    # Выгрузка Telegram Desktop для сбора базы знаний бывает в десятки мегабайт.
    client_max_body_size 96m;

    ssl_certificate     /etc/letsencrypt/live/support.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Билет на чтение вложений/WS живёт 10 минут и может осесть в access-логе,
    # поэтому лог панели держим выключенным, а сам лог — чувствительным.
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket панели (живое обновление диалогов).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Долгоживущий WS не должен рваться по таймауту.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
