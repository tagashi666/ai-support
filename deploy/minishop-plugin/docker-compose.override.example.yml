services:
  backend:
    image: ${MINISHOP_AI_SUPPORT_IMAGE:-minishop-backend-ai-support:3.7.1}
    environment:
      MINISHOP_AI_SUPPORT_TOKEN: ${MINISHOP_AI_SUPPORT_TOKEN:?set a long random token}
      MINISHOP_AI_SUPPORT_ADMIN_TELEGRAM_ID: ${MINISHOP_AI_SUPPORT_ADMIN_TELEGRAM_ID:-}
      PLUGINS_ENABLED: "true"
      PLUGINS_STRICT: "true"
